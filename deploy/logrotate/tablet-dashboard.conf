# Log rotation for the dashboard, run daily by the tablet-logrotate user timer (installed by
# scripts/install-autostart.sh; @DIR@ is the project folder). No root needed: state lives in run/.
# copytruncate because systemd keeps logs/dashboard.log open in append mode.
@DIR@/logs/*.log {
    weekly
    maxsize 20M
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
